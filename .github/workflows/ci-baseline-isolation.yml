name: CI Baseline Isolation

on:
  push:
    branches:
      - feature/ci-baseline-root-cause
  workflow_dispatch:

jobs:
  discover:
    name: Discover baseline tests
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test matrix
        id: tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('tests')
            .filter((name) => name.endsWith('.test.mjs'))
            .sort()
            .map((name) => `tests/${name}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `files=${JSON.stringify(files)}\n`);
          console.log(`Discovered ${files.length} baseline test files.`);
          NODE

  test-file:
    name: Baseline · ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run isolated test file
        env:
          TEST_FILE: ${{ matrix.file }}
        run: node --liftoff-only --wasm-num-compilation-tasks=1 --test "$TEST_FILE"
