name: Storage Dependency Bootstrap

on:
  push:
    branches:
      - feature/neon-storage-provider

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install storage dependencies
        run: npm install --save-exact @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(storage): add s3 client dependencies"
          git push origin HEAD:feature/neon-storage-provider
