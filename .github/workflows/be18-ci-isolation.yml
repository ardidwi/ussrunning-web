name: BE-18 CI Isolation

on:
  push:
    branches:
      - feature/be18-ci-root-cause
  workflow_dispatch:

jobs:
  discover:
    name: Discover test files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test matrix
        id: tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('tests')
            .filter((name) => name.endsWith('.test.mjs'))
            .sort()
            .map((name) => `tests/${name}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `files=${JSON.stringify(files)}\n`);
          console.log(`Discovered ${files.length} test files.`);
          NODE

  test-file:
    name: BE-18 · ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run isolated test file
        env:
          TEST_FILE: ${{ matrix.file }}
        run: node --liftoff-only --wasm-num-compilation-tasks=1 --test "$TEST_FILE"

  aggregate:
    name: BE-18 aggregate · concurrency ${{ matrix.concurrency }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 2, 4, default]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run aggregate test suite
        shell: bash
        env:
          TEST_CONCURRENCY: ${{ matrix.concurrency }}
        run: |
          if [[ "$TEST_CONCURRENCY" == "default" ]]; then
            node --liftoff-only --wasm-num-compilation-tasks=1 --test tests/*.test.mjs
          else
            node --liftoff-only --wasm-num-compilation-tasks=1 --test --test-concurrency="$TEST_CONCURRENCY" tests/*.test.mjs
          fi
