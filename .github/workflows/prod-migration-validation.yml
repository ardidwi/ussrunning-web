name: Production Migration Validation

on:
  push:
    branches:
      - feature/prod-migration-checksum-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Print migration checksums
        run: npm run db:migrate -- --dry-run
